name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate chain configs and project rules
        run: bun run validate
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build site
        run: bun run build
